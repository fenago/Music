# SongForge — static single-page app + tiny callback function.
# No build step: Netlify serves /public as-is.

[build]
  publish = "public"
  functions = "netlify/functions"

# Same-origin proxy to the Suno API so the browser never hits CORS.
# The user's key is sent as an Authorization header and passed straight through.
[[redirects]]
  from = "/suno/*"
  to = "https://api.sunoapi.org/:splat"
  status = 200
  force = true

# Same-origin proxy to the Suno API file-upload service (temporary files, 3-day retention).
[[redirects]]
  from = "/suno-files/*"
  to = "https://sunoapiorg.redpandaai.co/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
